server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true

spring:
  application:
    name: nepse-portfolio
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nepse_portfolio}
    username: ${DB_USER:nepse}
    password: ${DB_PASSWORD:nepse}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # SMTP is optional; do not report the whole app DOWN when it is not configured.
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Override in production. Must be at least 32 characters.
    secret: ${JWT_SECRET:nepse-portfolio-development-secret-key-change-me-please}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
  cors:
    # "*" (pattern) = allow every origin: same-network phones, LAN IPs and
    # random Cloudflare/ngrok tunnel domains. Narrow it if you ever host this
    # for a closed user base.
    allowed-origins: ${CORS_ORIGINS:*}
  scraper:
    enabled: ${SCRAPER_ENABLED:true}
    live-url: ${SCRAPER_LIVE_URL:https://www.sharesansar.com/live-trading}
    interval-ms: ${SCRAPER_INTERVAL_MS:90000}
    # NEPSE fetch window (in `timezone`). Periodic runs outside the window make
    # no requests at all; admin force-scrapes bypass it. Set SCRAPER_ACTIVE_TO
    # to e.g. 15:10 if you want to catch NEPSE's post-close final prints.
    active-from: ${SCRAPER_ACTIVE_FROM:11:00}
    active-to: ${SCRAPER_ACTIVE_TO:15:00}
    timezone: Asia/Kathmandu
    user-agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
    request-timeout-ms: 15000
  # Trading week + session times. Only a fallback: it is stored per deployment in
  # the app_settings table and admins edit it via PUT /api/admin/market/calendar.
  # NEPSE has changed its trading week before (Sun-Thu -> Mon-Fri).
  market-calendar:
    trading-days: ${MARKET_TRADING_DAYS:SUN,MON,TUE,WED,THU}
    market-open: "11:00"
    market-close: "15:00"
  # Live quote providers, tried in order until one succeeds.
  market:
    providers: ${MARKET_PROVIDERS:nepse,sharesansar}
  # NEPSE's own (undocumented) public API. Unofficial, educational use.
  nepse:
    enabled: ${NEPSE_ENABLED:true}
    # Import NEPSE's full security universe on startup (set false for offline demos).
    universe-on-startup: ${NEPSE_UNIVERSE_ON_STARTUP:true}
    base-url: ${NEPSE_BASE_URL:https://www.nepalstock.com}
    token-path: /api/authenticate/prove
    live-market-path: /api/nots/lives-market
    security-list-path: /api/nots/security?nonDelisted=true
    company-list-path: /api/nots/company/list
    user-agent: ${NEPSE_USER_AGENT:Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36}
    request-timeout-ms: ${NEPSE_REQUEST_TIMEOUT_MS:15000}
    # NEPSE tokens are valid for roughly 45 seconds.
    token-ttl-seconds: ${NEPSE_TOKEN_TTL_SECONDS:40}
  history:
    backfill:
      # socrateai-official/nepse-open-data (MIT): one adjusted OHLC CSV per trading day.
      base-url: ${HISTORY_BACKFILL_BASE_URL:https://raw.githubusercontent.com/socrateai-official/nepse-open-data/main}
      parallelism: ${HISTORY_BACKFILL_PARALLELISM:6}
      # Automatic maintenance: on startup (fills a fresh DB, repairs gaps) and a
      # nightly check after market close that repairs missing days. The manual
      # admin endpoint always stays available.
      auto: ${HISTORY_BACKFILL_AUTO:true}
      days: ${HISTORY_BACKFILL_DAYS:260}
      repair-cron: "0 40 15 * * MON-FRI"
  ml:
    enabled: ${ML_ENABLED:true}
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${ML_TIMEOUT_MS:2500}
    # Below this class probability the model is not confident enough to override the rules.
    min-confidence: ${ML_MIN_CONFIDENCE:0.35}
  contact:
    admin-email: ${ADMIN_EMAIL:}
    from: ${MAIL_FROM:no-reply@nepse.local}
  seed:
    demo-user: ${SEED_DEMO_USER:true}

logging:
  level:
    com.nepse.portfolio: INFO
    org.springframework.security: WARN
