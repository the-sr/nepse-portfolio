name: CI

# - Every push/PR: tests + builds for all three services, so main stays green.
# - Every push to main (after tests/builds pass): auto-bump and push a version
#   tag (v*), build and push Docker images to GHCR, and publish a GitHub Release
#   with the same assets the Termux deployment pulls.
#
# Two ways to deploy from this one workflow:
#   - Termux/Android phone: `deploy.sh` in ~/nepse downloads the release assets
#     (nepse-portfolio.jar + frontend-dist.zip) and restarts the backend.
#   - Any server with Docker: pull ghcr.io/<owner>/nepse-portfolio/{backend,frontend,ml}
#     and run them (docker compose or your own setup).
#
# Note: the tag is created and pushed inside the same run that builds the images,
# so we never rely on a pushed tag re-triggering a new workflow run (the default
# GITHUB_TOKEN cannot do that).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Build fat jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: ML service tests
        working-directory: ml-service
        run: python -m pytest -q

  # Auto-bump and push a version tag. Runs only on pushes to main (not PRs).
  # Default bump is patch; include "#minor" or "#major" in a commit message to override.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, ml]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: bump
        run: |
          set -euo pipefail
          # Latest v* tag (e.g. v0.4.5). Default to v0.0.0 if none exists.
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          [ -z "$latest" ] && latest="v0.0.0"
          version="${latest#v}"

          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest##*.}"

          # Allow overrides via commit message: "#minor" or "#major".
          msg=$(git log -1 --pretty=%B)
          bump="patch"
          if echo "$msg" | grep -qiE '#major([[:space:]]|$)'; then
            bump="major"
          elif echo "$msg" | grep -qiE '#minor([[:space:]]|$)'; then
            bump="minor"
          fi

          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "Bumping $latest -> $next ($bump)"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          git tag "$version"
          git push origin "$version"

  # Build and push Docker images to GHCR. Runs on main after the tag job.
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        id: prep
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/nepse-portfolio/backend:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/nepse-portfolio/backend:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.owner }}/nepse-portfolio/backend:${{ needs.tag.outputs.version }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/nepse-portfolio/frontend:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/nepse-portfolio/frontend:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.owner }}/nepse-portfolio/frontend:${{ needs.tag.outputs.version }}

      - name: Build and push ml
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/nepse-portfolio/ml:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/nepse-portfolio/ml:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.owner }}/nepse-portfolio/ml:${{ needs.tag.outputs.version }}

  # Publish a GitHub Release for the newly created tag with the exact assets
  # the Termux phone pulls: nepse-portfolio.jar + frontend-dist.zip.
  # Rebuilds inside the job instead of using artifacts (robust, no cross-job downloads).
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tag, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package assets
        run: |
          set -euo pipefail
          cp backend/target/portfolio-*.jar nepse-portfolio.jar
          (cd frontend/dist && zip -qr ../../frontend-dist.zip .)
          unzip -l frontend-dist.zip | head -5
          ls -la nepse-portfolio.jar frontend-dist.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" nepse-portfolio.jar frontend-dist.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Automated release $TAG."
