name: CI

# - Every push/PR: run tests and builds so main stays green.
# - A version tag (v*) additionally publishes a GitHub Release with two assets
#   that the Android/Termux deployment pulls: nepse-portfolio.jar + frontend-dist.zip

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Build fat jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: nepse-portfolio-jar
          path: backend/target/portfolio-*.jar
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          jar_file=$(ls artifacts/nepse-portfolio-jar/portfolio-*.jar | head -n1)
          cp "$jar_file" nepse-portfolio.jar
          (cd artifacts/frontend-dist && zip -qr ../../frontend-dist.zip .)
          gh release create "$TAG" nepse-portfolio.jar frontend-dist.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Automated release $TAG — deploy with deploy/termux-deploy.sh"
